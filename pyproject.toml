[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "simulink-mcp"
version = "0.1.0"
description = "Simulink MCP tools — give AI agents structured access to Simulink via MATLAB Engine"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
simulink-mcp = "server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "matlab*"]

[tool.setuptools.package-data]
"matlab" = ["*.m"]
